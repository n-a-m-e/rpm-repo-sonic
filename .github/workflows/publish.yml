name: Build and publish SonicDE RPM repo

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
  packages: write

jobs:
  publish:
    uses: n-a-m-e/linux-package-build-publisher/.github/workflows/publish.yml@main
    with:
      package-type: rpm
      app-id: sonicde
      source-git: https://github.com/n-a-m-e/rpm-app-sonic.git
      build-script: build.sh
      targets: |
        openmandriva-cooker-x86_64
      rebuild-trigger: |
        git sonic-app https://github.com/n-a-m-e/rpm-app-sonic.git main
